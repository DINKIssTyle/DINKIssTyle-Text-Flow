version: '3'

# This information is used to generate the build assets.
info:
  companyName: "DINKIssTyle"
  productName: "DKST Text Flow"
  productIdentifier: "com.dinkisstyle.textflow"
  description: "Text expansion utility by DINKI'ssTyle."
  copyright: "(c) 2026, DINKIssTyle"
  comments: "Text expansion utility by DINKI'ssTyle."
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
